name: tests

on: [push, pull_request]

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Installer les dépendances
        run: uv sync --extra ui
      - name: Lancer les tests
        run: uv run pytest
        env:
          PYTHONIOENCODING: utf-8
